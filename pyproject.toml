[project]
name = "sealed-styles-court"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "httpx>=0.27.0",
  "numpy>=2.0",
  "rank-bm25>=0.2.2",
  "networkx>=3.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.scripts]
build = "python build.py"
